<!DOCTYPE html>
<html lang="tr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA & Mobile Fullscreen Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#09090b">
    <!-- GÜVENLİK: Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://esm.sh; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self' https:; frame-ancestors 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <link rel="manifest" href="/manifest.json">
    
    <!-- Browser Tab & Shortcut Icons (Updated to Specific Supabase Image) -->
    <link rel="icon" type="image/png" href="https://xbbzwitvlrdwnoushgpf.supabase.co/storage/v1/object/public/Bac_Logo/bac.jpeg">
    <link rel="shortcut icon" type="image/png" href="https://xbbzwitvlrdwnoushgpf.supabase.co/storage/v1/object/public/Bac_Logo/bac.jpeg">
    <link rel="apple-touch-icon" href="https://xbbzwitvlrdwnoushgpf.supabase.co/storage/v1/object/public/Bac_Logo/bac.jpeg">

    <title>BAC Handels - Kurumsal Yönetim</title>

    <!-- Tema FOUC önleme: React mount'tan önce localStorage'dan oku -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('app_theme');
          var html = document.documentElement;
          if (stored === 'light') {
            html.classList.remove('dark');
            html.classList.add('light');
          }
        } catch (e) { /* localStorage erişilemez — dark default kalır */ }
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              zinc: {
                850: '#1f1f22',
                900: '#18181b',
                950: '#09090b',
              },
              primary: {
                500: '#6366f1', // Indigo
                600: '#4f46e5',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #09090b; /* Zinc-950 */
        color: #e4e4e7; /* Zinc-200 */
        /* Dynamic Viewport Height for Mobile Browsers
           - 100vh fallback: Samsung Internet eski sürümler ve dvh desteği olmayanlar için.
           - 100dvh: modern Chrome/Safari/Firefox. Adres çubuğu açılırken ekran daralmaz. */
        height: 100vh;
        height: 100dvh;
        width: 100vw;
        overflow: hidden; /* App-like feel */
        overscroll-behavior: none; /* Prevent elastic scrolling/pull-to-refresh */
        -webkit-user-select: none; /* Prevent text selection */
        user-select: none;
        -webkit-tap-highlight-color: transparent; /* Remove blue tap highlight */
      }
      /* Uygulama kabuğu: cross-browser tam ekran. Tailwind arbitrary [height:100dvh]
         eski Samsung Internet'te invalid kuralı atlatamadığı için CSS cascade ile
         iki kuralı yan yana yazıyoruz: 100dvh tanımsızsa 100vh devrede kalır. */
      .app-shell {
        height: 100vh;
        height: 100dvh;
      }
      input, textarea, [contenteditable] {
        -webkit-user-select: text;
        user-select: text;
      }
      #root {
        height: 100%;
        width: 100%;
      }
      /* Custom Scrollbar for Dark Theme */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #09090b;
      }
      ::-webkit-scrollbar-thumb {
        background: #27272a;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3f3f46;
      }
      .glass-panel {
        background: rgba(24, 24, 27, 0.4);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      /* Safe Area for iPhones */
      .pb-safe {
        padding-bottom: calc(env(safe-area-inset-bottom) + 12px);
      }

      /* =============================================================
         LIGHT MODE — html.light root altında zinc dark sınıflarını
         beyaz arka plan + siyah yazı şemasına çeviren override katmanı.
         Komponentler dark sınıflarını (bg-zinc-900, text-zinc-200 vs.)
         olduğu gibi kullanmaya devam eder; bu blok specificity ile
         override eder. !important gerekli çünkü Tailwind utility'leri
         element üzerinde direkt kuralla geliyor.
         ============================================================= */
      html.light body {
        background-color: #ffffff;
        color: #18181b;
      }
      /* Backgrounds — solid */
      html.light .bg-zinc-950 { background-color: #ffffff !important; }
      html.light .bg-zinc-900 { background-color: #f4f4f5 !important; }
      html.light .bg-zinc-850 { background-color: #e4e4e7 !important; }
      html.light .bg-zinc-800 { background-color: #e4e4e7 !important; }
      html.light .bg-zinc-700 { background-color: #d4d4d8 !important; }
      /* Backgrounds — alpha */
      html.light .bg-zinc-900\/30 { background-color: rgba(244, 244, 245, 0.5) !important; }
      html.light .bg-zinc-900\/40 { background-color: rgba(244, 244, 245, 0.6) !important; }
      html.light .bg-zinc-900\/50 { background-color: rgba(244, 244, 245, 0.7) !important; }
      html.light .bg-zinc-900\/60 { background-color: rgba(244, 244, 245, 0.8) !important; }
      html.light .bg-zinc-900\/80 { background-color: rgba(244, 244, 245, 0.9) !important; }
      html.light .bg-zinc-900\/95 { background-color: rgba(244, 244, 245, 0.95) !important; }
      html.light .bg-zinc-800\/30 { background-color: rgba(228, 228, 231, 0.4) !important; }
      html.light .bg-zinc-800\/40 { background-color: rgba(228, 228, 231, 0.5) !important; }
      html.light .bg-zinc-800\/50 { background-color: rgba(228, 228, 231, 0.6) !important; }
      html.light .bg-zinc-800\/80 { background-color: rgba(228, 228, 231, 0.9) !important; }
      /* Text — invert dark zinc shades to dark on light */
      html.light .text-white { color: #18181b !important; }
      html.light .text-zinc-100 { color: #18181b !important; }
      html.light .text-zinc-200 { color: #18181b !important; }
      html.light .text-zinc-300 { color: #27272a !important; }
      html.light .text-zinc-400 { color: #52525b !important; }
      html.light .text-zinc-500 { color: #71717a !important; }
      html.light .text-zinc-600 { color: #a1a1aa !important; }
      html.light .text-zinc-700 { color: #a1a1aa !important; }
      /* Borders */
      html.light .border-zinc-700 { border-color: #d4d4d8 !important; }
      html.light .border-zinc-800 { border-color: #e4e4e7 !important; }
      html.light .border-zinc-800\/30 { border-color: rgba(228, 228, 231, 0.6) !important; }
      html.light .border-zinc-800\/50 { border-color: rgba(228, 228, 231, 0.8) !important; }
      html.light .border-zinc-800\/80 { border-color: rgba(228, 228, 231, 0.9) !important; }
      /* Glass panel — light variant */
      html.light .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(0, 0, 0, 0.06);
      }
      /* Scrollbar */
      html.light ::-webkit-scrollbar-track { background: #f4f4f5; }
      html.light ::-webkit-scrollbar-thumb { background: #d4d4d8; }
      html.light ::-webkit-scrollbar-thumb:hover { background: #a1a1aa; }
      /* Hover variantları — bazı yerlerde hover:bg-zinc-800 kullanılıyor */
      html.light .hover\:bg-zinc-800:hover { background-color: #e4e4e7 !important; }
      html.light .hover\:bg-zinc-700:hover { background-color: #d4d4d8 !important; }
      html.light .hover\:text-white:hover { color: #18181b !important; }
      html.light .hover\:text-zinc-300:hover { color: #27272a !important; }
      html.light .hover\:border-zinc-700:hover { border-color: #d4d4d8 !important; }
    </style>

<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
