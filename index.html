<!DOCTYPE html>
<html lang="tr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA & Mobile Fullscreen Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#09090b">
    <!-- GÜVENLİK: Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://esm.sh; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self' https:; frame-ancestors 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <link rel="manifest" href="/manifest.json">
    
    <!-- Browser Tab & Shortcut Icons (Updated to Specific Supabase Image) -->
    <link rel="icon" type="image/png" href="https://xbbzwitvlrdwnoushgpf.supabase.co/storage/v1/object/public/Bac_Logo/bac.jpeg">
    <link rel="shortcut icon" type="image/png" href="https://xbbzwitvlrdwnoushgpf.supabase.co/storage/v1/object/public/Bac_Logo/bac.jpeg">
    <link rel="apple-touch-icon" href="https://xbbzwitvlrdwnoushgpf.supabase.co/storage/v1/object/public/Bac_Logo/bac.jpeg">

    <title>BAC Handels - Kurumsal Yönetim</title>

    <!-- Tema FOUC önleme: React mount'tan önce localStorage'dan oku -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('app_theme');
          var html = document.documentElement;
          if (stored === 'light') {
            html.classList.remove('dark');
            html.classList.add('light');
          }
        } catch (e) { /* localStorage erişilemez — dark default kalır */ }
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              zinc: {
                850: '#1f1f22',
                900: '#18181b',
                950: '#09090b',
              },
              primary: {
                500: '#6366f1', // Indigo
                600: '#4f46e5',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #09090b; /* Zinc-950 */
        color: #e4e4e7; /* Zinc-200 */
        /* Dynamic Viewport Height for Mobile Browsers
           - 100vh fallback: Samsung Internet eski sürümler ve dvh desteği olmayanlar için.
           - 100dvh: modern Chrome/Safari/Firefox. Adres çubuğu açılırken ekran daralmaz. */
        height: 100vh;
        height: 100dvh;
        width: 100vw;
        overflow: hidden; /* App-like feel */
        overscroll-behavior: none; /* Prevent elastic scrolling/pull-to-refresh */
        -webkit-user-select: none; /* Prevent text selection */
        user-select: none;
        -webkit-tap-highlight-color: transparent; /* Remove blue tap highlight */
      }
      /* Uygulama kabuğu: cross-browser tam ekran. Tailwind arbitrary [height:100dvh]
         eski Samsung Internet'te invalid kuralı atlatamadığı için CSS cascade ile
         iki kuralı yan yana yazıyoruz: 100dvh tanımsızsa 100vh devrede kalır. */
      .app-shell {
        height: 100vh;
        height: 100dvh;
      }
      input, textarea, [contenteditable] {
        -webkit-user-select: text;
        user-select: text;
      }
      #root {
        height: 100%;
        width: 100%;
      }
      /* Custom Scrollbar for Dark Theme */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #09090b;
      }
      ::-webkit-scrollbar-thumb {
        background: #27272a;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3f3f46;
      }
      .glass-panel {
        background: rgba(24, 24, 27, 0.4);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      /* Safe Area for iPhones */
      .pb-safe {
        padding-bottom: calc(env(safe-area-inset-bottom) + 12px);
      }

      /* =============================================================
         LIGHT MODE — Bac-Handels Premium Corporate Light
         Apple Silver + Linear Light hibridi. Slate paleti üzerinde
         saf siyah/beyazdan kaçınan, kurumsal ve premium estetik.
         BAC kırmızısı destructive aksiyonlar + logo vurgusu için
         saklanmıştır (genel accent değil). Indigo primary korunur.
         ============================================================= */
      html.light body {
        background-color: #f8fafc; /* slate-50 */
        color: #0f172a;            /* slate-900 */
      }

      /* --- Yüzey katmanları (zinc → slate light) --- */
      html.light .bg-zinc-950 { background-color: #f8fafc !important; }
      html.light .bg-zinc-900 { background-color: #ffffff !important; }
      html.light .bg-zinc-850 { background-color: #f1f5f9 !important; }
      html.light .bg-zinc-800 { background-color: #e2e8f0 !important; }
      html.light .bg-zinc-700 { background-color: #cbd5e1 !important; }

      /* --- Yarı şeffaf yüzeyler --- */
      html.light .bg-zinc-900\/30 { background-color: rgba(255, 255, 255, 0.4) !important; }
      html.light .bg-zinc-900\/40 { background-color: rgba(255, 255, 255, 0.5) !important; }
      html.light .bg-zinc-900\/50 { background-color: rgba(255, 255, 255, 0.7) !important; }
      html.light .bg-zinc-900\/60 { background-color: rgba(255, 255, 255, 0.8) !important; }
      html.light .bg-zinc-900\/80 { background-color: rgba(255, 255, 255, 0.92) !important; }
      html.light .bg-zinc-900\/95 { background-color: rgba(255, 255, 255, 0.97) !important; }
      html.light .bg-zinc-800\/30 { background-color: rgba(241, 245, 249, 0.5) !important; }
      html.light .bg-zinc-800\/40 { background-color: rgba(241, 245, 249, 0.6) !important; }
      html.light .bg-zinc-800\/50 { background-color: rgba(241, 245, 249, 0.7) !important; }
      html.light .bg-zinc-800\/80 { background-color: rgba(241, 245, 249, 0.9) !important; }

      /* --- Metin hiyerarşisi (slate paletine map) --- */
      html.light .text-white,
      html.light .text-zinc-100,
      html.light .text-zinc-200 { color: #0f172a !important; } /* slate-900 */
      html.light .text-zinc-300 { color: #1e293b !important; } /* slate-800 */
      html.light .text-zinc-400 { color: #475569 !important; } /* slate-600 */
      html.light .text-zinc-500 { color: #64748b !important; } /* slate-500 */
      html.light .text-zinc-600 { color: #94a3b8 !important; } /* slate-400 */
      html.light .text-zinc-700 { color: #cbd5e1 !important; } /* slate-300 — dekoratif */

      /* --- Kenarlıklar --- */
      html.light .border-zinc-700 { border-color: #cbd5e1 !important; } /* slate-300 */
      html.light .border-zinc-800 { border-color: #e2e8f0 !important; } /* slate-200 */
      html.light .border-zinc-800\/30 { border-color: rgba(226, 232, 240, 0.5) !important; }
      html.light .border-zinc-800\/50 { border-color: rgba(226, 232, 240, 0.75) !important; }
      html.light .border-zinc-800\/80 { border-color: rgba(226, 232, 240, 0.9) !important; }
      html.light .border-zinc-900,
      html.light .border-zinc-900\/50 { border-color: #f1f5f9 !important; }

      /* --- Glass-panel premium light variant --- */
      html.light .glass-panel {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(12px) saturate(180%);
        -webkit-backdrop-filter: blur(12px) saturate(180%);
        border: 1px solid rgba(15, 23, 42, 0.06);
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04), 0 1px 2px rgba(15, 23, 42, 0.06);
      }

      /* --- Scrollbar --- */
      html.light ::-webkit-scrollbar-track { background: #f1f5f9; }
      html.light ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      html.light ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

      /* --- Hover variantları --- */
      html.light .hover\:bg-zinc-800:hover { background-color: #e2e8f0 !important; }
      html.light .hover\:bg-zinc-700:hover { background-color: #cbd5e1 !important; }
      html.light .hover\:bg-zinc-900:hover { background-color: #f1f5f9 !important; }
      html.light .hover\:text-white:hover { color: #0f172a !important; }
      html.light .hover\:text-zinc-100:hover,
      html.light .hover\:text-zinc-200:hover { color: #0f172a !important; }
      html.light .hover\:text-zinc-300:hover { color: #1e293b !important; }
      html.light .hover\:border-zinc-700:hover { border-color: #94a3b8 !important; }

      /* --- Cards subtle elevation: bg-zinc-900 ile çevrili kartlara
             premium gölge ekle (sadece tam beyaz yüzeyler için) --- */
      html.light .bg-zinc-900.border,
      html.light .bg-zinc-900.rounded-xl,
      html.light .bg-zinc-900.rounded-2xl,
      html.light .bg-zinc-900.rounded-lg {
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.06);
      }

      /* --- Şube neon renkleri light variant (300 → 700) ---
             Dark tema'da text-cyan-300 gibi açık tonlar light bg'de
             solar; 700 tonuyla okunabilirlik sağlanır. --- */
      html.light .text-cyan-300,
      html.light .text-cyan-400 { color: #0e7490 !important; }   /* cyan-700 */
      html.light .text-fuchsia-300,
      html.light .text-fuchsia-400 { color: #a21caf !important; } /* fuchsia-700 */
      html.light .text-amber-300,
      html.light .text-amber-400 { color: #b45309 !important; }  /* amber-700 */
      html.light .text-emerald-300,
      html.light .text-emerald-400 { color: #047857 !important; } /* emerald-700 */
      html.light .text-rose-300,
      html.light .text-rose-400 { color: #be123c !important; }   /* rose-700 */
      html.light .text-indigo-300,
      html.light .text-indigo-400 { color: #4338ca !important; } /* indigo-700 */
      html.light .text-blue-300,
      html.light .text-blue-400 { color: #1d4ed8 !important; }   /* blue-700 */
      html.light .text-red-300,
      html.light .text-red-400 { color: #b91c1c !important; }    /* red-700 — BAC marka tonuna yakın */

      /* --- BAC marka kırmızısı: header başlık ve destructive vurgular --- */
      html.light .text-rose-500 { color: #dc2626 !important; }   /* red-600 */
      html.light .text-red-500 { color: #dc2626 !important; }
      html.light .bg-red-600\/20 { background-color: rgba(220, 38, 38, 0.1) !important; }
      html.light .border-red-600\/40 { border-color: rgba(220, 38, 38, 0.4) !important; }

      /* --- Indigo primary light tone'u biraz koyulaştır
             (light bg'de okuma kontrastı artar) --- */
      html.light .text-indigo-500 { color: #4f46e5 !important; } /* indigo-600 */
      html.light .bg-indigo-600\/20 { background-color: rgba(79, 70, 229, 0.1) !important; }
      html.light .border-indigo-600\/30,
      html.light .border-indigo-600\/40 { border-color: rgba(79, 70, 229, 0.3) !important; }

      /* --- Zinc-900 başlık gradient'i (BAC Handels yazısı) --- */
      html.light .from-white { --tw-gradient-from: #0f172a !important; }
      html.light .to-zinc-400 { --tw-gradient-to: #475569 !important; }
    </style>

<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
